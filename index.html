<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E">
<title>سبحة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-deep:#0F3D3E;
    --teal-dark:#0A2C2D;
    --gold:#C9A227;
    --gold-soft:#E4C766;
    --parchment:#F7F1E3;
    --sand-muted:#8C7A54;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: radial-gradient(circle at 50% 20%, var(--teal-dark), #061c1d 85%);
    color:var(--parchment);
    font-family:'Tajawal', sans-serif;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  #app{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: env(safe-area-inset-top,28px) 20px calc(env(safe-area-inset-bottom,20px) + 14px);
    position:relative;
  }

  /* ---- top: phrase + total ---- */
  #top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-top:8px;
  }
  #phrase{
    font-family:'Amiri', serif;
    font-size:clamp(26px, 7vw, 34px);
    color:var(--gold-soft);
    letter-spacing:0.5px;
  }
  #totalLabel{
    font-size:13px;
    color:var(--sand-muted);
    font-weight:400;
  }

  /* ---- center: ring + counter ---- */
  #center{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    width:100%;
  }
  #ringWrap{
    position:relative;
    width:min(72vw, 300px);
    height:min(72vw, 300px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  svg#ring{ position:absolute; top:0; left:0; width:100%; height:100%; transform:rotate(-90deg); }
  svg#ring circle.track{ fill:none; stroke:rgba(255,255,255,0.06); stroke-width:10; }
  svg#ring circle.fill{ fill:none; stroke:var(--gold); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 0.15s ease-out; }

  #count{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:clamp(56px, 18vw, 96px);
    line-height:1;
    color:var(--parchment);
    transition:transform 0.12s ease-out;
  }
  #count.pulse{ transform:scale(1.08); }
  #targetLine{
    position:absolute;
    bottom:-6px;
    font-size:14px;
    color:var(--sand-muted);
  }

  #hint{
    font-size:13px;
    color:var(--sand-muted);
    margin-top:18px;
    opacity:0.8;
  }

  /* ---- bottom: phrase pills + reset ---- */
  #bottom{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  #pills{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:340px;
  }
  .pill{
    font-family:'Tajawal', sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(228,199,102,0.25);
    background:rgba(255,255,255,0.03);
    color:var(--sand-muted);
    cursor:pointer;
  }
  .pill.active{
    background:rgba(201,162,39,0.15);
    border-color:var(--gold);
    color:var(--gold-soft);
  }
  #resetBtn{
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:11px 34px;
    border-radius:999px;
    border:1px solid rgba(247,241,227,0.15);
    background:transparent;
    color:var(--parchment);
    opacity:0.85;
    cursor:pointer;
  }
  #resetBtn:active{ background:rgba(255,255,255,0.06); }

  #flash{
    position:fixed; inset:0;
    background:var(--gold);
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  #flash.on{ animation:flashAnim 0.5s ease-out; }
  @keyframes flashAnim{
    0%{opacity:0;} 15%{opacity:0.18;} 100%{opacity:0;}
  }

  #confirmOverlay{
    position:fixed; inset:0;
    background:rgba(6,20,20,0.88);
    display:none;
    align-items:center; justify-content:center;
    z-index:10;
  }
  #confirmOverlay.show{ display:flex; }
  #confirmBox{
    background:var(--teal-dark);
    border:1px solid rgba(228,199,102,0.2);
    border-radius:18px;
    padding:26px 28px;
    text-align:center;
    max-width:280px;
  }
  #confirmBox p{ margin:0 0 18px; font-size:15px; color:var(--parchment); }
  #confirmBtns{ display:flex; gap:10px; justify-content:center; }
  #confirmBtns button{
    font-family:'Tajawal', sans-serif;
    padding:9px 20px;
    border-radius:999px;
    border:none;
    font-size:14px;
    cursor:pointer;
  }
  #confirmYes{ background:var(--gold); color:var(--teal-dark); font-weight:700; }
  #confirmNo{ background:rgba(255,255,255,0.08); color:var(--parchment); }
</style>
</head>
<body>
<div id="flash"></div>
<div id="app">

  <div id="top">
    <div id="phrase">سُبْحَانَ اللَّه</div>
    <div id="totalLabel">الإجمالي: <span id="totalVal">0</span></div>
  </div>

  <div id="center">
    <div id="ringWrap">
      <svg id="ring" viewBox="0 0 220 220">
        <circle class="track" cx="110" cy="110" r="100"></circle>
        <circle class="fill" id="ringFill" cx="110" cy="110" r="100"></circle>
      </svg>
      <div id="count">0</div>
      <div id="targetLine">الهدف: <span id="targetVal">33</span></div>
    </div>
  </div>

  <div id="hint">مرّر بإصبعك لأعلى أو لأسفل للعدّ</div>

  <div id="bottom">
    <div id="pills"></div>
    <button id="resetBtn">تصفير</button>
  </div>

</div>

<div id="confirmOverlay">
  <div id="confirmBox">
    <p>هل تريد تصفير العدّاد الحالي؟</p>
    <div id="confirmBtns">
      <button id="confirmYes">نعم، صفّر</button>
      <button id="confirmNo">إلغاء</button>
    </div>
  </div>
</div>

<script>
(function(){
  const PHRASES = [
    { key:"subhan",   label:"سُبْحَانَ اللَّه",      short:"سبحان الله",     target:33  },
    { key:"hamd",     label:"الْحَمْدُ لِلَّه",       short:"الحمد لله",       target:33  },
    { key:"tahlil",   label:"لَا إِلَٰهَ إِلَّا اللَّه", short:"لا إله إلا الله", target:33 },
    { key:"takbir",   label:"اللَّهُ أَكْبَر",        short:"الله أكبر",       target:34  },
    { key:"istighfar",label:"أَسْتَغْفِرُ اللَّه",     short:"أستغفر الله",     target:100 },
    { key:"salawat",  label:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّد", short:"الصلاة على النبي", target:100 },
  ];

  const STORE_KEY = "tasbih_counts_v1";
  const TOTAL_KEY = "tasbih_total_v1";

  let counts = {};
  let total = 0;
  try{
    const saved = localStorage.getItem(STORE_KEY);
    counts = saved ? JSON.parse(saved) : {};
    total = parseInt(localStorage.getItem(TOTAL_KEY) || "0", 10);
  }catch(e){ counts = {}; total = 0; }

  let activeIndex = 0;
  try{
    const lastActive = localStorage.getItem("tasbih_active_v1");
    if(lastActive !== null) activeIndex = Math.min(parseInt(lastActive,10) || 0, PHRASES.length-1);
  }catch(e){}

  const phraseEl = document.getElementById("phrase");
  const countEl = document.getElementById("count");
  const targetValEl = document.getElementById("targetVal");
  const totalValEl = document.getElementById("totalVal");
  const ringFill = document.getElementById("ringFill");
  const pillsEl = document.getElementById("pills");
  const resetBtn = document.getElementById("resetBtn");
  const flashEl = document.getElementById("flash");
  const confirmOverlay = document.getElementById("confirmOverlay");
  const confirmYes = document.getElementById("confirmYes");
  const confirmNo = document.getElementById("confirmNo");

  const CIRC = 2 * Math.PI * 100;
  ringFill.style.strokeDasharray = CIRC;

  function currentCount(){
    const key = PHRASES[activeIndex].key;
    return counts[key] || 0;
  }
  function setCurrentCount(v){
    const key = PHRASES[activeIndex].key;
    counts[key] = v;
    persist();
  }
  function persist(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(counts));
      localStorage.setItem(TOTAL_KEY, String(total));
      localStorage.setItem("tasbih_active_v1", String(activeIndex));
    }catch(e){}
  }

  function renderPills(){
    pillsEl.innerHTML = "";
    PHRASES.forEach((p, i) => {
      const btn = document.createElement("div");
      btn.className = "pill" + (i === activeIndex ? " active" : "");
      btn.textContent = p.short;
      btn.addEventListener("click", () => {
        activeIndex = i;
        renderPills();
        renderAll();
        persist();
      });
      pillsEl.appendChild(btn);
    });
  }

  function renderAll(){
    const p = PHRASES[activeIndex];
    phraseEl.textContent = p.label;
    const c = currentCount();
    countEl.textContent = c;
    targetValEl.textContent = p.target;
    totalValEl.textContent = total;
    const progress = (c % p.target) / p.target;
    const offset = CIRC * (1 - progress);
    ringFill.style.strokeDashoffset = (c > 0 && progress === 0) ? 0 : offset;
  }

  function vibrate(pattern){
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }

  function chime(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 660;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(ctx.destination);
      const now = ctx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      o.start(now);
      o.stop(now + 0.42);
    }catch(e){}
  }

  function increment(){
    const p = PHRASES[activeIndex];
    let c = currentCount() + 1;
    setCurrentCount(c);
    total += 1;
    persist();
    renderAll();

    countEl.classList.add("pulse");
    setTimeout(() => countEl.classList.remove("pulse"), 140);
    vibrate(10);

    if(c % p.target === 0){
      flashEl.classList.remove("on");
      void flashEl.offsetWidth;
      flashEl.classList.add("on");
      vibrate([0,30,60,30]);
      chime();
    }
  }

  /* ---- scroll capture: wheel + touch drag ---- */
  const THRESHOLD = 46; // px of movement per count
  let touchStartY = null;
  let touchAccum = 0;
  let wheelAccum = 0;
  let wheelTimer = null;

  window.addEventListener("wheel", (e) => {
    e.preventDefault();
    wheelAccum += Math.abs(e.deltaY);
    while(wheelAccum >= THRESHOLD){
      increment();
      wheelAccum -= THRESHOLD;
    }
  }, { passive:false });

  window.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
    touchAccum = 0;
  }, { passive:true });

  window.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if(touchStartY === null) return;
    const y = e.touches[0].clientY;
    const delta = Math.abs(y - touchStartY);
    touchStartY = y;
    touchAccum += delta;
    while(touchAccum >= THRESHOLD){
      increment();
      touchAccum -= THRESHOLD;
    }
  }, { passive:false });

  window.addEventListener("touchend", () => {
    touchStartY = null;
    touchAccum = 0;
  }, { passive:true });

  /* ---- reset ---- */
  resetBtn.addEventListener("click", () => {
    confirmOverlay.classList.add("show");
  });
  confirmNo.addEventListener("click", () => {
    confirmOverlay.classList.remove("show");
  });
  confirmYes.addEventListener("click", () => {
    setCurrentCount(0);
    renderAll();
    confirmOverlay.classList.remove("show");
  });

  renderPills();
  renderAll();

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
